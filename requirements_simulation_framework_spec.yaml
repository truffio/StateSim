abstract: >
  This document specifies a lightweight software framework intended to make
  aircraft Autoflight / Autopilot guidance system requirements dynamic and
  interactive rather than static text. Requirements are modeled as a
  collection of independent components, each representing a portion of the
  system (analogous to a Line Replaceable Unit or a software subsystem).
  Each component may internally use a state machine, a rule-based system,
  a simple timer, or a combination of these to define its behavior. There
  is no control-loop or real-time performance modeling involved; any effect
  that would normally result from a control loop is represented as a timer.
  Components communicate through periodically computed values passed via a
  shared execution context, and through discrete events broadcast on a
  shared event bus. Two conceptual layers exist in parallel: a command
  layer that reacts to events and issues actions, and a monitoring layer
  that continuously observes system state and raises events when it
  detects undesirable conditions. The framework is deliberately minimal —
  it is a short-lived internal tool for requirement exploration and
  maturation, not a production or public-facing system, and is not intended
  to be over-engineered with error handling, input validation, or sandboxing
  beyond what is described below. A Python backend orchestrates simulation
  execution and exposes state, values, and events to a JavaScript/HTML/CSS
  web front end (a mock cockpit with panels) over WebSockets, enabling
  requirements to be observed and manipulated dynamically rather than only
  read on paper.

framework:

  components:
    description: >
      A component is the fundamental unit of the framework, representing a
      portion of the system (e.g. an LRU or software subsystem/function).
    composition:
      - state_machine: optional
      - rule_based_system: optional
      - timer: optional
      note: >
        A component may be any single one of these, any combination, or
        none beyond simple pass-through logic. Internal variables and
        logic are private to the component; only designated outputs are
        exposed to the rest of the system.
    definition_source: >
      Each component's state machine and/or rules are defined in a
      dedicated JSON file, using an existing JSON schema (defined
      separately/previously, not specified in this document) for state
      machines and rule logic. The framework loads this JSON at start time.
    logic_evaluation: >
      Rule and transition conditions are logical expressions written using
      actual context variable names, evaluated directly via Python's eval
      at runtime. No AST sanitization, sandboxing, or expression validation
      is performed; the tool is internal-only and rule authors are trusted.
    layers:
      command_layer: >
        Reacts to events and periodic evaluations by issuing actions/
        commands (represented abstractly; no real control output).
      monitoring_layer: >
        Continuously observes command layer state/output and other
        context values; evaluates for undesirable combinations of
        conditions ("situations") and raises events when detected.
      note: >
        Both layers run concurrently within the same framework and use the
        same underlying mechanisms (state machines, rules, timers, events).

  master_configuration:
    description: >
      A single master JSON file defines the overall simulation composition.
    contents:
      - component_name: identifier for each component
      - component_file: path to that component's JSON definition file
      - execution_rate: how often the component is scheduled to execute
      - additional_parameters: anything else required to instantiate the
          component (TBD as needed)

  component_configuration:
    description: >
      Each component has its own JSON file, following a common schema
      across all components, containing:
      - state machine definition (if applicable)
      - rule definitions (if applicable)
      - any initial values or parameters needed by the component
    note: >
      The specific JSON schema for state machines and rules is assumed to
      already exist from prior work and is out of scope for this document.

  inter_component_communication:
    event_bus:
      purpose: >
        Primary mechanism for inter-component communication. When a state
        machine transitions or a rule fires, an event may be broadcast on
        the shared event bus. Not all internal changes generate events —
        only those meant to be visible/actionable to other components or
        the outside world (including the web front end).
      priority:
        status: not implemented initially, but designed for
        rationale: >
          It is foreseeable that a priority scheme (e.g. monitoring/safety
          events preempting command-layer processing) may be required once
          real aircraft requirements are modeled. The event bus should be
          architected to support prioritized events as a future feature,
          even though the initial implementation may treat all events
          uniformly.
    shared_context:
      purpose: >
        Periodically computed values are exposed by components and consumed
        by others as inputs, avoiding a polling model.
      mechanism: >
        Rather than a fully global/shared context (simple but hard to
        control write-access to), each component is passed a reference to
        the relevant context at the time it is scheduled for execution.
        This keeps the orchestrator in control of execution order and
        makes each component's inputs explicit.

  timing_and_execution:
    clock: >
      A simulation clock is maintained by the framework since timer-based
      logic depends on it.
    execution_model: >
      A main execution loop runs as fast as possible (not synchronized to
      real wall-clock time). At the start of each iteration, simulation
      time is incremented and both the current time and the delta time
      since the last iteration are made available to all components.
    scheduling: >
      Components are scheduled for execution at a configured rate (per the
      master configuration), not strictly real-time, but ordered/paced by
      the simulation loop.

  frontend_and_communication:
    architecture: >
      Python backend server hosts the orchestrator and all components.
      A web-based front end (JavaScript, HTML, CSS) presents a mock cockpit
      with panels representing the system under exploration.
    transport: >
      WebSockets connect backend and client(s), allowing events and data
      to flow bidirectionally in real time and making it straightforward
      to add additional components or clients to the platform later.

  logging:
    minimum_implementation: >
      Plain text log file output.
    contents:
      - timestamp
      - component name
      - event or action description
      - relevant variable values involved in triggering the event/action
    scope_note: >
      Exact logging content/format is to be determined as the framework
      matures; a basic flat-file approach is sufficient for now. Migration
      to a more structured or persistent logging solution (e.g. database)
      may be considered later if needed, but is not required initially.

  explicit_non_goals:
    - No error handling for component failures/invalid states (deferred).
    - No context validation before component execution (deferred).
    - No sandboxing or AST inspection of rule expressions; eval is used
      directly, trusting internal rule authors.
    - No real-time / control-loop performance modeling; any such effect is
      represented as a timer.
    - No intent to generalize this into a long-lived or public tool; it is
      a short-lived internal aid for requirement maturation, to be retired
      once real aircraft software implementation exists.
