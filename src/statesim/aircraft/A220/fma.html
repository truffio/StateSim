<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Flight Mode Annunciator</title>
<!--
  StateSim aircraft panel: the previous tool's FMA strip, generated from the
  fma_logic section of ap.json. Every mode text is lit by its FMA equation
  (equations.csv); a text is shown only while lit. Top row: engaged modes
  (green). Bottom row: armed modes (white). Engage column: AP on top, AT at
  the bottom, and between them the white AP <- AT arrow.
-->
<style>
  .fma { display: grid; grid-template-columns: 190px 230px 100px 280px;
          background: #000; border-radius: 12px; padding: 6px 4px; width: max-content;
          font-family: Arial, Helvetica, sans-serif; font-weight: 400; font-size: 24px;
          letter-spacing: 1px; line-height: 1; box-shadow: 0 10px 20px rgba(0,0,0,0.4); }
  .col { display: flex; flex-direction: column; justify-content: space-between;
          height: 80px; padding: 8px 6px; border-right: 4px solid #3a4148; }
  .col:last-child { border-right: 0; }
  .row { display: grid; grid-template-columns: repeat(var(--n, 1), 1fr); gap: 6px; }
  .slot { height: 1.1em; text-align: center; white-space: nowrap; }
  .arrow { height: 10px; display: flex; align-items: center; }
  .arrow .m.lit { display: block; position: relative; width: 100%; height: 6px;
                   margin-left: 10px; background: #f2f2f2; }
  .arrow .m.lit::before { content: ""; position: absolute; left: -12px; top: -7px;
                           border-style: solid; border-width: 10px 14px 10px 0;
                           border-color: transparent #f2f2f2 transparent transparent; }
  .m { display: none; }
  .m.lit { display: inline; }
  .eng { color: #3cc843; }
  .arm { color: #ffffff; }
  .m.white { color: #ffffff; }
  /* FMA editor (recording report): positions are [data-slot]; colours by class */
  .fma-c-green { color: #3cc843; } .fma-c-white { color: #ffffff; } .fma-c-yellow { color: #f2e34c; }
  .fma-c-amber { color: #f5a623; } .fma-c-red { color: #ff4a4a; }
  [data-slot-extra] { display: none; }
  .fma-edit [data-slot-extra] { display: block; }
  .fma-edit .row.eng-top { --n: 2; }
  .arrow.right .m.lit { transform: scaleX(-1); }
</style>
</head>
<body>
<div class="fma" data-slot-colors="green white yellow amber red" role="group" aria-label="Flight mode annunciator">
<div class="col" aria-label="Thrust"><div class="row" style="--n:1"><div class="slot eng" title="TM_engaged" data-slot="thrust-top" data-slot-color="green"><span class="m" data-lit-by="fma_tm_engaged_hold">HOLD</span><span class="m" data-lit-by="fma_tm_engaged_thrust">THRUST</span><span class="m" data-lit-by="fma_tm_engaged_spd">SPD</span><span class="m" data-lit-by="fma_tm_engaged_retard">RETARD</span></div></div><div class="row" style="--n:1"><div class="slot arm" title="TM_armed" data-slot="thrust-bot" data-slot-color="white"><span class="m" data-lit-by="fma_tm_armed_hold">HOLD</span></div></div></div>
<div class="col" aria-label="Lateral"><div class="row" style="--n:2"><div class="slot eng" title="LNAV_engaged_1" data-slot="lat-top-1" data-slot-color="green"><span class="m" data-lit-by="fma_lnav_engaged_1_appr">APPR</span></div><div class="slot eng" title="LNAV_engaged_2" data-slot="lat-top-2" data-slot-color="green"><span class="m" data-lit-by="fma_lnav_engaged_2_to">TO</span><span class="m" data-lit-by="fma_lnav_engaged_2_fms1">FMS1</span><span class="m" data-lit-by="fma_lnav_engaged_2_loc1">LOC1</span><span class="m" data-lit-by="fma_lnav_engaged_2_loc">LOC</span><span class="m" data-lit-by="fma_lnav_engaged_2_align">ALIGN</span><span class="m" data-lit-by="fma_lnav_engaged_2_rollout">Rollout</span></div></div><div class="row" style="--n:2"><div class="slot arm" title="LNAV_armed_1" data-slot="lat-bot-1" data-slot-color="white"><span class="m" data-lit-by="fma_lnav_armed_1_appr">APPR</span></div><div class="slot arm" title="LNAV_armed_2" data-slot="lat-bot-2" data-slot-color="white"><span class="m" data-lit-by="fma_lnav_armed_2_fms1">FMS1</span><span class="m" data-lit-by="fma_lnav_armed_2_loc1">LOC1</span><span class="m" data-lit-by="fma_lnav_armed_2_align">ALIGN</span><span class="m" data-lit-by="fma_lnav_armed_2_rollout">Rollout</span></div></div></div>
<div class="col" aria-label="Engage"><div class="row eng-top"><div class="slot eng" data-slot="eng-top-dr" data-slot-color="green" data-slot-extra></div><div class="slot eng" title="ap_visible" data-slot="eng-top-ap" data-slot-color="green"><span class="m" data-lit-by="fma_ap_visible">AP</span></div></div><div class="arrow" data-slot="eng-bot-couple" data-slot-kind="arrow" data-slot-color="white"><div class="m" data-lit-by="fma_ap_at_arrow" aria-label="AP &lt;- AT arrow"></div></div><div class="row"><div class="slot eng" title="at_color" data-slot="eng-bot-at" data-slot-color="white"><span class="m " data-lit-by="fma_at_color_green">AT</span><span class="m white" data-lit-by="fma_at_color_white">AT</span></div></div></div>
<div class="col" aria-label="Vertical"><div class="row" style="--n:3"><div class="slot eng" title="VNAV_engaged_1" data-slot="vert-top-1" data-slot-color="green"><span class="m" data-lit-by="fma_vnav_engaged_1_to">TO</span><span class="m" data-lit-by="fma_vnav_engaged_1_flc">FLC</span><span class="m" data-lit-by="fma_vnav_engaged_1_alts">ALTS</span><span class="m" data-lit-by="fma_vnav_engaged_1_gs">GS</span><span class="m" data-lit-by="fma_vnav_engaged_1_flare">FLARE</span></div><div class="slot eng" data-slot="vert-top-ref" data-slot-color="green"></div></div><div class="row" style="--n:3"><div class="slot arm" title="VNAV_armed_1" data-slot="vert-bot-alt" data-slot-color="white"><span class="m" data-lit-by="fma_vnav_armed_1_flc">FLC</span><span class="m" data-lit-by="fma_vnav_armed_1_alts">ALTS</span><span class="m" data-lit-by="fma_vnav_armed_1_flare">FLARE</span></div><div class="slot arm" title="VNAV_armed_2" data-slot="vert-bot-fms" data-slot-color="white"><span class="m" data-lit-by="fma_vnav_armed_2_flc">FLC</span><span class="m" data-lit-by="fma_vnav_armed_2_alts">ALTS</span></div><div class="slot arm" title="VNAV_armed_3" data-slot="vert-bot-appr" data-slot-color="white"><span class="m" data-lit-by="fma_vnav_armed_3_gs">GS</span></div></div></div>
</div>
</body>
</html>
