<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StateSim</title>
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="timeline.css">
</head>
<body>
<header class="top" id="top" aria-label="Aircraft panels" hidden></header>
<div class="layout">
  <div class="left" id="left">
    <section class="panels" id="panels" aria-label="Aircraft panels"></section>
    <section class="inputs" id="inputs" aria-label="Inputs"></section>
    <div class="topbar" id="runbar">
      <div class="seg" role="group" aria-label="Run mode">
        <button type="button" id="mode-realtime" data-mode="realtime">Real time</button>
        <button type="button" id="mode-fast" data-mode="fast">As fast as possible</button>
      </div>
      <button type="button" class="btn" id="pause">Pause</button>
      <button type="button" class="btn" id="step" disabled>Step</button>
      <button type="button" class="btn" id="reset">Reset</button>
      <button type="button" class="btn" id="timeline-toggle" aria-pressed="false" aria-controls="timeline">Timeline</button>
      <a class="btn" id="timeline-save" href="timeline.txt" download="statesim-timeline.txt" hidden
         title="Save the current run's timeline as a text file">Save as text</a>
      <button type="button" class="btn rec" id="rec-start" hidden
              title="Start an FMA recording (logging is not affected)">Start recording</button>
      <button type="button" class="btn rec on" id="rec-stop" hidden
              title="Stop the FMA recording and open its report">Stop recording</button>
      <span class="rec-clock" id="rec-clock" role="status" hidden></span>
    </div>
  </div>

  <div class="splitter" id="splitter" role="separator" aria-orientation="vertical"
       aria-label="Resize panes" aria-valuemin="280" aria-valuenow="440" tabindex="0"></div>

  <div class="right">
    <section class="machines" id="machines" aria-label="State machines"></section>
  </div>
</div>
<div class="tl-splitter" id="timeline-splitter" role="separator" aria-orientation="horizontal"
     aria-label="Resize timeline" aria-valuemin="120" aria-valuenow="260" tabindex="0" hidden></div>
<section class="timeline" id="timeline" aria-label="Timeline" hidden></section>
<div class="banner" id="banner" role="status" hidden></div>
<script src="panels.js"></script>
<script src="timeline.js"></script>
<script src="recording.js"></script>
<script src="app.js"></script>
</body>
</html>
